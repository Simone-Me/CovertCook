<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#C6202C"/>

  <!-- Testa e toque: la faccia della variante B, mascherina incastrata sotto la falda. -->
