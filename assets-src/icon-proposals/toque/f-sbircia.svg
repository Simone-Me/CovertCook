    <path d="M 162 324 v -52 a 74 74 0 0 1 24 -142 a 76 76 0 0 1 140 0 a 74 74 0 0 1 24 142 v 52 Z"/>
    <path d="M 150 312 h 212 a 16 16 0 0 1 16 16 v 30 a 50 50 0 0 1 -50 50 h -14 a 44 44 0 0 1 -38 -22 l -8 -14 h -24 l -8 14 a 44 44 0 0 1 -38 22 h -14 a 50 50 0 0 1 -50 -50 v -30 a 16 16 0 0 1 16 -16 Z"/>
  </g>
  <g fill="#C6202C">
