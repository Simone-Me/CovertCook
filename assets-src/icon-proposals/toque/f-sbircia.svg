    <path d="M 32 428 v -36 h 8 v -25 a 13 13 0 0 1 26 0 v 25 h 8 v -25 a 13 13 0 0 1 26 0 v 25 h 8 v -25 a 13 13 0 0 1 26 0 v 25 h 8 v 36 a 20 20 0 0 1 -20 20 h -70 a 20 20 0 0 1 -20 -20 Z"/>
