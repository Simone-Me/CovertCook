<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- PNG first: the mark is a cream wok on a red tile, which is the only
         version that survives a dark browser tab. A black glyph on transparent
         disappears into one entirely. -->
    <!-- No SVG link any more, and that is the point: browsers prefer an SVG
         icon when both are offered, so the old placeholder kept winning and
         the wok never appeared. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#C6202C" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CovertCook</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
