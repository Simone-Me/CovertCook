# SonarCloud setup (once):
#  1. https://sonarcloud.io -> log in with GitHub -> import Simone-Me/CovertCook.
#  2. Copy the organization and project keys it shows over the two values below.
#  3. My Account -> Security -> generate a token, add it as the repo secret
#     SONAR_TOKEN (Settings -> Secrets and variables -> Actions).
#  4. In SonarCloud, turn OFF "Automatic Analysis" (this workflow replaces it).
sonar.organization=simone-me
sonar.projectKey=Simone-Me_CovertCook

sonar.sources=src,supabase/functions
sonar.exclusions=**/node_modules/**,dist/**,src/locales/**,**/*.css,assets-src/**,android/**,supabase/migrations/**,supabase/smoke_test*.sql
sonar.sourceEncoding=UTF-8
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Migrations repeat whole function bodies on purpose: `create or replace function`
# has to carry the full text each time, and the smoke tests share one fixture.
# Duplication there is the format, not a smell.
sonar.cpd.exclusions=supabase/migrations/**,supabase/smoke_test*.sql
