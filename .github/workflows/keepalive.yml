name: Keep Supabase project awake

# Supabase Free pauses a project after 7 days with no incoming API request.
# This must be an EXTERNAL ping — pg_cron running inside the project does
# not reliably reset that timer, since it isn't an inbound API request.
# Twice a week is comfortably inside the 7-day window with margin for a
# missed run.
on:
  schedule:
    - cron: '17 6 * * 1,4' # Monday and Thursday, 06:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping a trivial public REST endpoint
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ vars.VITE_SUPABASE_ANON_KEY }}" \
            "${{ vars.VITE_SUPABASE_URL }}/rest/v1/")
          echo "status=$status"
          # PostgREST returns 200 (or occasionally 401 without a bearer
          # token depending on config) for a bare root request — either
          # means the project responded, which is all this job needs.
          if [ "$status" -ge 500 ]; then
            echo "Supabase project did not respond normally"
            exit 1
          fi
